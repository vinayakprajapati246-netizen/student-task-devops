apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: student-task-backend
  namespace: student-task
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: backend
  namespaceSelector:
    matchNames: [student-task]
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
